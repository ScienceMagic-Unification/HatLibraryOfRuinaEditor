appId: com.hat.ruinaeditor
productName: 帽子的废墟图书馆编辑器
directories:
  output: release
  buildResources: build
files:
  - out/**/*
asar: true
electronDist: ./node_modules/electron/dist
electronDownload:
  cache: .cache/electron-builder
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: HatLibraryOfRuinaEditor-${version}-win-x64.${ext}
  extraFiles:
    - from: ../../docs/WINDOWS_PORTABLE.txt
      to: README.zh-CN.txt
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  unicode: true
  requestExecutionLevel: user
linux:
  icon: build/icon.png
  category: Utility
  maintainer: 帽子(Hat) <hat@users.noreply.github.com>
  artifactName: ${productName}-${version}.${ext}
  target:
    - AppImage
    - deb
compression: normal
